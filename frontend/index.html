<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DAOGuard: governance intelligence and execution assurance for DAO proposals." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DAOGuard · DAO Audit Engine</title>
    <script>
      try {
        var t = localStorage.getItem("daoguard.theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
